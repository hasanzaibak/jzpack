name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install latest compatible package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Compile sources
        run: python -m compileall -q jzpack tests

  minimum-dependencies:
    name: tests / Python 3.10 / minimum runtime dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Pin minimum supported runtime dependencies
        run: python -m pip install --no-deps "msgpack==1.0.0" "zstandard==0.21.0"
      - name: Verify minimum runtime versions
        run: python -c "from importlib.metadata import version; assert version('msgpack') == '1.0.0'; assert version('zstandard') == '0.21.0'"
      - name: Run tests
        run: python -m pytest -q
      - name: Compile sources
        run: python -m compileall -q jzpack tests

  platform-contracts:
    name: platform contracts / ${{ matrix.os }} / Python 3.13
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Build and verify source distribution
        run: |
          python - <<'PYCODE'
          import subprocess
          import tarfile
          from pathlib import Path, PurePosixPath

          caches = {".hypothesis", ".pytest_cache", ".ruff_cache", "__pycache__"}
          for name in caches:
              directory = Path(name)
              directory.mkdir(exist_ok=True)
              (directory / "distribution-test-sentinel").write_text("generated cache")
          subprocess.run(["python", "-m", "build"], check=True)
          archives = list(Path("dist").glob("*.tar.gz"))
          assert len(archives) == 1, "expected one source distribution"
          with tarfile.open(archives[0]) as archive:
              members = [PurePosixPath(member.name) for member in archive]
          assert all(not caches.intersection(member.parts) for member in members), "cache leaked into source distribution"
          files = {str(PurePosixPath(*member.parts[1:])) for member in members}
          assert {"README.md", "LICENSE", "pyproject.toml", "jzpack/__init__.py", "jzpack/py.typed"} <= files, "required source files missing"
          PYCODE
