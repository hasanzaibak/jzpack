[project]
name = "jzpack"
dynamic = ["version"]
description = "JSON/NDJSON compression and storage library"
authors = [{name = "hasanzaibak"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["json", "compression", "ndjson", "zstd", "msgpack", "logs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving :: Compression",
    "Typing :: Typed",
]
dependencies = [
    "msgpack>=1.0.0",
    "zstandard>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "build>=1.2.0",
    "black>=24.0.0,<26.0.0",
    "isort>=5.0.0,<8.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/hasanzaibak/jzpack"
Repository = "https://github.com/hasanzaibak/jzpack"
Issues = "https://github.com/hasanzaibak/jzpack/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jzpack"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.hypothesis/**",
    "/.ruff_cache/**",
]

[tool.hatch.version]
path = "jzpack/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
